# Conteneur DMZ de l'espace des élus. Domaine, port et adresse du backend LAN sont PARAMÉTRÉS (D23) : rien n'est écrit en dur.
services:
  elus-dmz:
    build: { context: ., dockerfile: Dockerfile }
    restart: always
    ports: ["${ELUS_DMZ_PORT:-5161}:80"]
    environment:
      BACKEND_HOST: ${ELUS_BACKEND_HOST:?adresse du backend VibeDélib sur le LAN}
      BACKEND_PORT: ${ELUS_BACKEND_PORT:-3121}
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run, /tmp, /etc/nginx/conf.d]
    security_opt: ["no-new-privileges:true"]
