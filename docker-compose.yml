# VibeDélib — Docker Compose : backend + frontend (+ PostgreSQL local facultatif, + serveur de documents facultatif).
# Ports : frontend 5160 (nginx, relaie /api), backend 3021, espace élus DMZ 5161 (à venir).
# Les secrets viennent du fichier .env à la racine (jamais versionné) ; aucune URL ni clé n'est écrite ici.
#
#   docker compose up -d --build                  backend + frontend, PostgreSQL = celui du .env (serveur partagé)
#   docker compose --profile local-db up -d --build   ajoute un PostgreSQL local (POSTGRES_HOST=postgres dans le .env)
#   docker compose --profile bureau up -d --build     ajoute le serveur de documents (édition Word/Excel dans le
#                                                     navigateur), relayé par le frontal sous /office-delib/ — aucun port
#                                                     publié ; BUREAU_MOTEUR=onlyoffice, BUREAU_URL,
#                                                     BUREAU_URL_NAVIGATEUR=/office-delib, BUREAU_URL_RAPPEL et
#                                                     BUREAU_JWT_SECRET sont alors nécessaires.
#
# Fichiers persistants : ./backend/storage (annexes, fonds de page, logo). Polices de la Ville : ./police (lecture seule).
services:
  backend:
    build: { context: ./backend }
    restart: always
    env_file: .env
    environment:
      - NODE_ENV=production
      - PORT=3021
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5160}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-http://localhost:5160}
      - SCHEDULER_ENABLED=${SCHEDULER_ENABLED:-false}
    volumes:
      - ./backend/storage:/app/storage
      - ./police:/police:ro
    ports: ["3021:3021"]

  frontend:
    build: { context: ./frontend }
    restart: always
    depends_on: [backend]
    ports: ["5160:80"]

  # Serveur de documents (bureau en ligne, D39) : édite les annexes Word/Excel dans le navigateur et sert aussi à la
  # conversion en PDF. Son stockage interne est un volume à part (documents temporaires + cache de rendu) : les
  # documents, eux, restent chez nous (disque ou Alfresco), le moteur ne fait que les lire et les rendre.
  #
  # ATTENTION : AUCUN port n'est publié pour le moteur, et c'est voulu. Le frontal relaie /office-delib/ sous le même nom
  # d'hôte que l'application (donc en HTTPS, sans contenu mixte) : BUREAU_URL_NAVIGATEUR=/office-delib côté .env.
  # Si vous publiiez le moteur sur son propre port, l'application en HTTPS chargerait un cadre en HTTP : le navigateur
  # marquerait la page « Non sécurisé » et finirait par bloquer l'éditeur (contenu mixte).
  #
  # Version épinglée sur une branche de versions maintenue (« 9.4 » = tous les correctifs 9.4.x) : la tag flottante
  # « latest » ferait monter la version majeure sans contrôle ni test.
  # ATTENTION : l'édition communautaire est sous licence AGPL-3.0 et limitée en nombre de connexions simultanées
  # (documentserver community). Au-delà, licence OnlyOffice Server (commerciale) — voir MANIFEST §35.
  # Consommateur de ressources : prévoir ~2 Go de RAM et un CPU de plus que l'application seule.
  documentserver:
    profiles: ["bureau"]
    image: onlyoffice/documentserver:9.4
    restart: always
    environment:
      - JWT_ENABLED=true
      - JWT_SECRET=${BUREAU_JWT_SECRET:?secret partagé avec le backend (BUREAU_JWT_SECRET) requis}
      - JWT_HEADER=Authorization
      - JWT_IN_BODY=true                   # le jeton voyage aussi dans le corps : relu par notre route de rappel
      # Le moteur rappelle le backend sur une adresse interne (10.x / 172.x) : il faut l'autoriser explicitement.
      # Conséquence assumée : le moteur peut télécharger une URL privée — il ne connaît que les adresses qu'on lui donne
      # (dépôt à usage unique) et ne répond à rien. ALLOW_META_IP_ADDRESS reste bloqué (pas de métadonnées d'instance).
      - ALLOW_PRIVATE_IP_ADDRESS=true
      - ALLOW_META_IP_ADDRESS=false
    volumes: ["officecache:/var/www/onlyoffice/Data", "officelogs:/var/log/onlyoffice"]
    depends_on: [backend]
    # Port publié UNIQUEMENT pour le développement local (application sur un poste, moteur sur ce serveur) : il permet
    # au poste de charger l'éditeur et d'appeler /converter en HTTP. La PRODUCTION ne s'en sert pas : elle passe par le
    # frontal, sous /office-delib, sur le même nom d'hôte (donc en HTTPS). Ne pas exposer ce port au-delà du réseau interne.
    ports: ["9980:80"]
    # Démarrage lent (migration de base interne au premier lancement) : prévoyez quelques minutes avant la première édition.

  # Second moteur, au choix de l'administration (réglage « Serveur de documents », par organisme). Collabora parle WOPI
  # (le backend est son hôte) au lieu de l'API d'ONLYOFFICE : même édition dans le navigateur, mêmes versions, mais pas
  # de commande d'enregistrement ni de conversion PDF — le PDF passe alors par le repli LibreOffice du backend.
  # ATTENTION : l'édition de développement (Collabora Online Development Edition, image `collabora/code`) est gratuite
  # pour l'évaluation ; un usage en production suppose un abonnement Collabora. Le nombre de connexions simultanées est
  # également borné. Voir MANIFEST §36.
  collabora:
    profiles: ["bureau"]
    image: collabora/code:latest
    restart: always
    cap_add: ["MKNOD"]             # demandé par Collabora (proxies d'E/S pour l'accès direct aux fichiers)
    environment:
      # Hôtes acceptés par le moteur : le navigateur arrive par notre frontal, sous le même nom d'hôte que l'application.
      # (Collabora n'a pas d'équivalent de `alias_name1` chez ONLYOFFICE : le préfixe /collabora-delib est celui de la
      # requête, transmis par le frontal via X-Forwarded-Host — voir frontend/nginx.conf.)
      - domain=${BUREAU_HOTE_PUBLIQUE:?nom d'hôte public de l'application requis (ex. vibedelib.ivry.local)}$
      # Le TLS est terminé par le proxy en amont : le moteur parle HTTP en interne, et annonce des URL en https.
      #   --o:ssl.enable=false        le moteur ne sert pas de TLS lui-même
      #   --o:ssl.termination=true    « un reverse proxy termine le TLS » : les URL annoncées deviennent https/wss
      #   --o:server_name=…          le nom d'hôte PUBLIC, sinon les URL retombent sur l'hôte du conteneur
      #   --o:net.service_root=…     DECISIF : Collabora ne travaille PAS sous un préfixe de chemin par défaut, il
      #                               annonce /browser/… à la racine. Cette option fait announced /collabora-delib/browser/…
      #                               pour les pages, le WebSocket et la découverte. Elle oblige en revanche le relais à
      #                               NE PAS retirer le préfixe (contrairement à /office-delib/) et Collabora à refuser une
      #                               requête qui n'est pas sous /collabora-delib.
      # ATTENTION : la syntaxe est `net.service_root` (point). Avec `net/service_root` ou `extra_params1`, l'option est
      # ignorée : l'éditeur s'ouvre, puis plus aucune ressource (JS, CSS, WebSocket) ne se charge.
      - extra_params=--o:ssl.enable=false --o:ssl.termination=true --o:server_name=${BUREAU_HOTE_PUBLIQUE:?nom d'hôte public requis} --o:net.service_root=/collabora-delib
      - username=${COLLABORA_ADMIN_USER:-admin}
      - password=${COLLABORA_ADMIN_PASSWORD:?mot de passe d'administration Collabora requis}
      - TZ=Europe/Paris
    volumes: ["collaboradata:/opt/cool/var/lib/cool", "collaboralogs:/var/log/collabora"]
    depends_on: [backend]
    # Port publié UNIQUEMENT pour le développement local (comme documentserver) ; la production passe par le frontal.
    ports: ["9981:9980"]
    # Démarrage lent (premier lancement) : prévoyez quelques minutes avant la première édition.

  # PostgreSQL local : uniquement avec --profile local-db (en production on utilise le serveur partagé du .env).
  postgres:
    profiles: ["local-db"]
    image: postgres:16-alpine
    restart: always
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-vibedelib}
      - POSTGRES_USER=${POSTGRES_USER:-vibedelib}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?mot de passe requis}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    ports: ["5432:5432"]

  # L'espace élus (DMZ) sera un conteneur distinct (front minimal + nginx à liste blanche), port 5161 — MANIFEST §18.

volumes:
  pgdata:
  officecache:
  officelogs:
  collaboradata:
  collaboralogs:
