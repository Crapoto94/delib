# Bureau en ligne : l'en-tête Connection ne doit valoir « upgrade » que pour le WebSocket de l'éditeur. Envoyé sans
# Upgrade correspondant, il casse le keep-alive des requêtes ordinaires (chargement de api.js, XHR de l'éditeur).
map $http_upgrade $bureau_connection {
  default upgrade;
  ''      close;
}

# Schéma annoncé au moteur : celui du client (posé par le proxy qui termine le TLS), et à défaut celui de cette requête.
# Le moteur recopie ce schéma dans les URL qu'il fabrique ; s'il vaut « http », le navigateur bloque le document
# (contenu mixte) et l'agent voit « échec du téléchargement ».
map $http_x_forwarded_proto $bureau_scheme {
  default $http_x_forwarded_proto;
  ''      $scheme;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 60m;            # annexes PDF (MAX_UPLOAD_MB du backend)

  # l'API est relayée : un seul port exposé, aucun souci de CORS
  location /api/ {
    proxy_pass http://backend:3021;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;           # génération de PDF volumineux
  }

  # Serveur de documents (bureau en ligne) : le frontal relaie /office-delib/ et son WebSocket, sous le MÊME nom d'hôte que
  # l'application — donc en HTTPS, sans contenu mixte et sans certificat supplémentaire. Le moteur n'est publié sur
  # aucun port : il n'est joignable que par ce frontal.
  #
  # Le nom d'hôte est résolu à la volée (résolveur Docker) pour que nginx démarre même quand le profil « bureau » n'est
  # pas activé (l'absence se traduit alors par un 502 explicite sur /office-delib/).
  #
  # `Host $host` (et non l'hôte du moteur) est indispensable : c'est ce nom que le moteur met dans ses URL, et il doit
  # rester celui de l'application.
  # Copie LAN du front élus, construite depuis elus-dmz/ dans la même image.
  # Le slash final garde les ressources relatives sous /elus/.
  location = /elus { return 301 /elus/; }
  location ^~ /elus/ {
    try_files $uri $uri/ /elus/index.html;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;
  }

  location /office-delib/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $office documentserver:80;
    # Le préfixe est retiré EXPLICITEMENT : avec une variable dans `proxy_pass`, nginx transmet l'URI telle quelle
    # (il ne fait pas le remplacement du préfixe comme avec un `proxy_pass` littéral). Sans ce `rewrite`, le moteur
    # reçoit « /office-delib/healthcheck » au lieu de « /healthcheck » et redirige vers sa page d'accueil.
    rewrite ^/office-delib/?(.*)$ /$1 break;
    proxy_pass http://$office;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Le moteur FABRIQUE ses URL (document, cache, images) à partir de ces en-têtes : c'est ce qui les rend correctes
    # (https, et sous notre préfixe). `X-Forwarded-Host` porte l'hôte ET le préfixe, `X-Forwarded-Prefix` doit être
    # VIDE sinon ONLYOFFICE ajoute le préfixe deux fois.
    # Le schéma est FIXÉ à https : l'application est toujours servie en HTTPS (le proxy qui termine le TLS relaie en
    # HTTP jusqu'ici, donc $scheme vaudrait « http » et le moteur annoncerait des URL http que le navigateur bloque —
    # « échec du téléchargement »). Ne pas remplacer par $scheme.
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host/office-delib;
    proxy_set_header X-Forwarded-Prefix "";
    proxy_set_header Upgrade $http_upgrade;          # WebSocket de l'éditeur (co-édition, curseurs)
    proxy_set_header Connection $bureau_connection;
    proxy_read_timeout 3600s;                        # une session d'édition peut durer des heures
    proxy_send_timeout 3600s;
    proxy_buffering off;
  }

  # Second moteur de documents (Collabora Online) : même relais, même nom d'hôte, même raison — le moteur n'est publié
  # sur aucun port et n'est joignable que par ce frontal. Il parle en revanche un autre protocole (WOPI) : c'est le
  # BACKEND qui est l'hôte de ce protocole, sous /api/v1/public/bureau/wopi/*, et le navigateur n'atteint Collabora que
  # par cette iframe. Les en-têtes de construction d'URL sont donc les mêmes, le préfixe étant /collabora-delib.
  #
  # CONTRAIREMENT à /office-delib/, on NE retire PAS le préfixe : Collabora est configuré avec
  # `--o:net.service_root=/collabora-delib`, il annonce donc ses pages, son WebSocket et sa découverte sous ce
  # préfixe, et REFUSE toute requête qui arrive ailleurs. Le `rewrite … break;` du bloc ONLYOFFICE serait ici une
  # erreur : le moteur répondrait « Bad request » et l'éditeur resterait blanc.
  location /collabora-delib/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $collabora collabora:9980;
    proxy_pass http://$collabora;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host/collabora-delib;
    proxy_set_header X-Forwarded-Prefix /collabora-delib;
    proxy_set_header Upgrade $http_upgrade;          # WebSocket de l'éditeur
    proxy_set_header Connection $bureau_connection;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
  }

  # nginx n'hérite des en-têtes de sécurité du niveau serveur que s'il n'y a aucun add_header ici : on les répète dans
  # les deux emplacements qui en posent un, sinon la page servie par « / » (et les fichiers de /assets/) en perdrait la
  # moitié.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;
  }
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;
  }
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy same-origin always;
}
