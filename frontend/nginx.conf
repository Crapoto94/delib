# Bureau en ligne : l'en-tête Connection ne doit valoir « upgrade » que pour le WebSocket de l'éditeur. Envoyé sans
# Upgrade correspondant, il casse le keep-alive des requêtes ordinaires (chargement de api.js, XHR de l'éditeur).
map $http_upgrade $bureau_connection {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 60m;            # annexes PDF (MAX_UPLOAD_MB du backend)

  # l'API est relayée : un seul port exposé, aucun souci de CORS
  location /api/ {
    proxy_pass http://backend:3021;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;           # génération de PDF volumineux
  }

  # Serveur de documents (bureau en ligne) : le frontal relaie /office/ et son WebSocket, sous le MÊME nom d'hôte que
  # l'application — donc en HTTPS, sans contenu mixte et sans certificat supplémentaire. Le moteur n'est publié sur
  # aucun port : il n'est joignable que par ce frontal.
  #
  # Le nom d'hôte est résolu à la volée (résolveur Docker) pour que nginx démarre même quand le profil « bureau » n'est
  # pas activé (l'absence se traduit alors par un 502 explicite sur /office/).
  #
  # `Host $host` (et non l'hôte du moteur) est indispensable : c'est ce nom que le moteur met dans ses URL, et il doit
  # rester celui de l'application.
  location /office/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $office documentserver:80;
    # Le préfixe est retiré EXPLICITEMENT : avec une variable dans `proxy_pass`, nginx transmet l'URI telle quelle
    # (il ne fait pas le remplacement du préfixe comme avec un `proxy_pass` littéral). Sans ce `rewrite`, le moteur
    # reçoit « /office/healthcheck » au lieu de « /healthcheck » et redirige vers sa page d'accueil.
    rewrite ^/office/?(.*)$ /$1 break;
    proxy_pass http://$office;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;          # WebSocket de l'éditeur (co-édition, curseurs)
    proxy_set_header Connection $bureau_connection;
    # La page de l'éditeur est redirigée par le moteur vers un chemin VERSIONNÉ (« /9.4.0-<empreinte>/web-apps/… ») qui
    # sortirait du préfixe : le navigateur demanderait ce chemin à l'application, qui rendrait sa propre page — éditeur
    # blanc. On la ramène dans /office. nginx conserve le schéma de la redirection d'origine (http, puisque le relais est
    # interne) : on force donc https, sinon un SDK chargé depuis une page HTTPS serait bloqué (contenu mixte).
    proxy_redirect http://$host/ https://$host/office/;
    proxy_redirect https://$host/ https://$host/office/;
    proxy_read_timeout 3600s;                        # une session d'édition peut durer des heures
    proxy_send_timeout 3600s;
    proxy_buffering off;
  }

  # nginx n'hérite des en-têtes de sécurité du niveau serveur que s'il n'y a aucun add_header ici : on les répète dans
  # les deux emplacements qui en posent un, sinon la page servie par « / » (et les fichiers de /assets/) en perdrait la
  # moitié.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;
  }
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;
  }
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy same-origin always;
}
