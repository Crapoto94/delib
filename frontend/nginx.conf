server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 60m;            # annexes PDF (MAX_UPLOAD_MB du backend)

  # l'API est relayée : un seul port exposé, aucun souci de CORS
  location /api/ {
    proxy_pass http://backend:3021;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;           # génération de PDF volumineux
  }

  # Le serveur de documents (bureau en ligne) n'est PAS relayé ici : ONLYOFFICE doit être servi sur sa propre origine.
  # Placé sous un sous-chemin (« /office/ »), il construit certaines URL internes sans le préfixe et l'éditeur ouvre un
  # mauvais contenu (« le contenu du fichier ne correspond pas à l'extension »). BUREAU_URL_NAVIGATEUR pointe donc
  # directement sur le port publié du moteur (voir MANIFEST §35 et docker-compose.yml).

  # nginx n'hérite des en-têtes de sécurité du niveau serveur que s'il n'y a aucun add_header ici : on les répète dans
  # les deux emplacements qui en posent un, sinon la page servie par « / » (et les fichiers de /assets/) en perdrait la
  # moitié.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;
  }
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;
  }
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy same-origin always;
}
